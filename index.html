<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>8 Games Gaming Station</title>
<style>
  body { font-family: Arial, sans-serif; background:#111; color:#fff; margin:0; padding:20px; }
  h1 { text-align:center; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px,1fr)); gap:15px; }
  .game { background:#222; padding:12px; border-radius:6px; position:relative; }
  iframe { width:100%; aspect-ratio:16/9; border:none; display:block; }
</style>
</head>
<body>
<h1>8 Games Gaming Station</h1>
<div class="grid">
  <div class="game"><h2>8 Ball Pool</h2><iframe src="https://prod-web-pool.miniclip.com/mc?localmc" title="8 Ball Pool"></iframe></div>
  <div class="game"><h2>Cube Worlds</h2><iframe src="https://cloud.onlinegames.io/games/2025/html/cube-worlds/index-og.html" title="Cube Worlds"></iframe></div>
  <div class="game"><h2>Cut the Rope</h2><iframe src="https://play.gamepix.com/cut-the-rope/embed" title="Cut the Rope"></iframe></div>
  <div class="game"><h2>Doom</h2><iframe src="https://nicholas.carlini.com/writing/2019/javascript-doom-clone-game.html" title="Doom"></iframe></div>
  <div class="game"><h2>Granny</h2><iframe src="https://html5.gamedistribution.com/ec2e7f9b7a9f441b92f19100627d94cc/" title="Granny"></iframe></div>
  <div class="game"><h2>Mine Game</h2><iframe src="https://html5.gamedistribution.com/4b88f962af114b0a88322938a647a603/" title="Mine Game"></iframe></div>
  <div class="game"><h2>Slither.io</h2><iframe src="https://slither.io" title="Slither.io"></iframe></div>
  <div class="game"><h2>Subway Surfers</h2><iframe src="https://szhong.4399.com/4399swf//upload_swf/ftp35/liuxinyu/20210324/jj01/index.html" title="Subway Surfers"></iframe></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const gameDivs = document.querySelectorAll('.game');
  let activeIndex = null;

  gameDivs.forEach((g, i) => {
    g.addEventListener('click', () => {
      // Reset ALL games to normal size
      gameDivs.forEach((g2, idx) => {
        g2.style.zIndex = '1';
        g2.querySelector('iframe').style.width = '100%';
        g2.querySelector('iframe').style.height = '300px';
        g2.querySelector('iframe').style.position = '';
        g2.querySelector('iframe').style.top = '';
        g2.querySelector('iframe').style.left = '';
      });

      // Activate the clicked game → full‑screen
      const iframe = g.querySelector('iframe');
      iframe.style.width = '100vw';
      iframe.style.height = '100vh';
      iframe.style.position = 'fixed';
      iframe.style.top = '0';
      iframe.style.left = '0';
      iframe.style.border = 'none';
      g.style.zIndex = '10';

      activeIndex = i;
    });
  });

  // Escape key returns to grid
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (document.fullscreenElement) {
        document.exitFullscreen();
      }
      gameDivs.forEach((g, i) => {
        g.style.zIndex = '1';
        g.querySelector('iframe').style.width = '100%';
        g.querySelector('iframe').style.height = '300px';
        g.querySelector('iframe').style.position = '';
        g.querySelector('iframe').style.top = '';
        g.querySelector('iframe').style.left = '';
      });
      activeIndex = null;
    }
  });
});
</script>
</body>
</html>
